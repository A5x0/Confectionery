name: Mirror to Codeberg

on:
  push:
    branches:
      - main
      - master

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to Codeberg
        run: |
          git remote add codeberg https://A5x0:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/A5x0/Confectionery.git
          git push --force --all codeberg
          git push --force --tags codeberg
